name: One-shot recipe copy fix

on:
  push:
    branches:
      - chatgpt/recipe-shopping-voice

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/recipe-shopping-voice
      - name: Patch legacy concierge wording
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/cart-pilot/CartPilotClient.tsx')
          text = path.read_text()
          replacements = {
              'Any cooking instructions for the restaurant? Say them now, or say no instructions.': 'Any special instructions for the merchant? Say them now, or say no instructions.',
              'Please tell me the cooking instructions again, or say no instructions.': 'Please tell me the special instructions again, or say no instructions.',
              "I couldn't confirm the cooking instructions, so I haven't added any. You can add them before checkout.": "I couldn't confirm the special instructions, so I haven't added any. You can add them before checkout.",
              '<strong>Cooking instructions:</strong>': '<strong>Special instructions:</strong>',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected phrase: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/cart-pilot/CartPilotClient.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Use merchant-neutral special instructions in voice flow"
          git push origin HEAD:chatgpt/recipe-shopping-voice
