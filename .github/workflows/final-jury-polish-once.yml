name: Final jury landing polish

on:
  push:
    branches: [chatgpt/final-jury-polish]

permissions:
  contents: write

jobs:
  patch-once:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/final-jury-polish
          fetch-depth: 0
      - name: Patch restored landing copy without changing layout
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/page.tsx')
          text = path.read_text()
          replacements = {
              "title: 'Agentic AI Checkout | Home',": "title: 'Aisle AI — Closed-Loop Commerce Copilot',",
              "description: 'Experience the future of local shopping with AI-powered product discovery and automated checkout. Connect with local merchants, discover fresh products, and enjoy seamless AI-driven purchasing.',": "description: 'A governed Gemini commerce copilot connecting grounded customer discovery, deterministic validation, explicit approval, persistent fulfillment, and merchant intelligence.',",
              "Smart AI agents find the best from <span>local merchants</span> near you!": "Gemini proposes grounded options; <span>deterministic controls</span> verify commerce facts before you approve.",
              "<h6 className=\"price text-primary\">$80</h6>": "<h6 className=\"price text-primary\">Synthetic demo</h6>",
              "href=\"https://www.instagram.com/dexignzone/\" target=\"_blank\">Instagram": "href=\"/copilot-lab\">Live Copilot",
              "href=\"https://www.facebook.com/dexignzone\" target=\"_blank\">Facebook": "href=\"/evidence\">Evidence",
              "href=\"https://twitter.com/dexignzones\" target=\"_blank\">twitter": "href=\"/trust\">Trust",
              "href=\"#\" className=\"service-btn btn-dark\">Let's talk": "href=\"/copilot-lab\" className=\"service-btn btn-dark\">Live Copilot",
              "href=\"shop-with-category.html\"": "href=\"/shop\"",
              "<a className=\"icon-button\" href=\"#\">": "<a className=\"icon-button\" href=\"/copilot-lab\">",
              "We're growing with 6.3k trusted local merchants": "One governed loop from customer intent to merchant action",
              "href=\"blog-tag.html\"": "href=\"/evidence\"",
              "<a href=\"#\" className=\"companies-wrapper\">": "<a href=\"/evidence\" className=\"companies-wrapper\">",
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected landing fragment: {old[:100]}')
              text = text.replace(old, new)

          path.write_text(text)
      - name: Remove one-shot workflow and push result
        run: |
          rm .github/workflows/final-jury-polish-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx .github/workflows/final-jury-polish-once.yml
          git commit -m "Polish restored landing for jury accuracy"
          git push origin HEAD:chatgpt/final-jury-polish
