name: CI

on:
  push:
    branches:
      - main
      - 'chatgpt/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend-build:
    name: Frontend production build and E2E smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies for critical issues
        run: npm audit --omit=dev --audit-level=critical

      - name: Build
        run: npm run build

      - name: Run full-stack Copilot smoke
        run: npm run test:e2e-smoke

      - name: Run deterministic commerce guard regressions
        run: npm run eval:commerce-guards

  frontend-lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  backend:
    name: Backend tests, evidence benchmarks and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Record resolved dependency versions
        run: python -m pip freeze

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run modeled interaction benchmark
        run: python evidence/impact_benchmark.py

      - name: Run synthetic held-out forecast backtest
        run: python evidence/forecast_backtest.py

      - name: Rehearse migrations on a fresh database
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci.db
        run: |
          rm -f ci.db
          alembic upgrade head
