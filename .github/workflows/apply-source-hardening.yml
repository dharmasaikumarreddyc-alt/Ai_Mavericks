name: Apply source hardening patches

on:
  push:
    branches:
      - chatgpt/hackathon-hardening
    paths:
      - .github/workflows/apply-source-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/hackathon-hardening
          fetch-depth: 0

      - name: Apply reviewed source patches
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, count: int = 1):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f'{path}: expected at least {count} occurrence(s), found {actual}: {old!r}')
              text = text.replace(old, new, count)
              file.write_text(text, encoding='utf-8')

          merchant = Path('backend/routers/merchant_dashboard.py')
          text = merchant.read_text(encoding='utf-8')
          old = '    comparable_days = len(comparison_dates)\n'
          new = (
              '    # Average only across comparable weekdays that actually have recorded orders.\n'
              '    # Treating every calendar occurrence as a zero-sales day materially understates\n'
              '    # demand when the prototype/demo history is sparse.\n'
              '    calendar_comparison_days = len(comparison_dates)\n'
              '    observed_comparable_days = len(matching_history_dates)\n'
          )
          if old not in text:
              raise SystemExit('merchant forecast denominator anchor not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              'entry["historicalUnits"] / max(comparable_days, 1)',
              'entry["historicalUnits"] / max(observed_comparable_days, 1)',
              1,
          )
          text = text.replace(
              '"comparisonWeeks": comparable_days,',
              '"comparisonWeeks": 0,\n            "calendarComparisonOccurrences": calendar_comparison_days,',
              1,
          )
          text = text.replace(
              'calendar comparison occurrences: {comparable_days}.',
              'calendar comparison occurrences: {calendar_comparison_days}.',
              1,
          )
          text = text.replace(
              '"comparisonWeeks": comparable_days,',
              '"comparisonWeeks": observed_comparable_days,\n        "calendarComparisonOccurrences": calendar_comparison_days,',
              1,
          )
          if 'max(comparable_days, 1)' in text:
              raise SystemExit('old forecast denominator is still present')
          merchant.write_text(text, encoding='utf-8')

          replace_exact(
              'app/copilot-lab/CopilotLabClient.tsx',
              '<div className="copilot-product-image"><img src={item.image} alt="" /><span>{Math.round(item.confidence * 100)}% fit</span></div>',
              '<div className="copilot-product-image"><img src={item.image} alt="" /><span>Gemini-ranked match</span></div>',
          )

          replace_exact(
              'generate_ppt.py',
              '"Manual friction destroys conversion rates and user patience. E-commerce\\n"\n         "remains a labour-intensive chore — and that is the problem Aisle AI\\n"\n         "was built to solve."',
              '"Manual browsing and repeated comparison add friction to the shopping journey.\\n"\n         "Aisle AI reduces those repeated steps by connecting grounded discovery,\\n"\n         "explicit confirmation, and merchant operations in one governed flow."',
          )

          # This helper is intentionally one-shot; remove it from the final branch.
          Path('.github/workflows/apply-source-hardening.yml').unlink()

      - name: Commit patches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/routers/merchant_dashboard.py app/copilot-lab/CopilotLabClient.tsx generate_ppt.py .github/workflows/apply-source-hardening.yml
          git diff --cached --check
          git commit -m "Fix forecast evidence math and demo claims"
          git push origin HEAD:chatgpt/hackathon-hardening
